name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify base install keeps Transformers optional
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -c "import importlib.util; assert importlib.util.find_spec('transformers') is None"
      - name: Compile package
        run: python -m compileall -q ser_lib scripts examples
      - name: Build distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip install build && python -m build
      - name: Smoke-test built wheel in isolated environment
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m venv ../ser-lib-wheel-smoke
          ../ser-lib-wheel-smoke/bin/python -m pip install --upgrade pip
          ../ser-lib-wheel-smoke/bin/python -m pip install dist/*.whl
          ../ser-lib-wheel-smoke/bin/python -m pip check
          cd ..
          ser-lib-wheel-smoke/bin/python - <<'PY'
          import importlib.metadata
          import importlib.util
          from pathlib import Path

          import ser_lib

          repo = Path("Speech-Emotion-Recognition").resolve()
          imported = Path(ser_lib.__file__).resolve()
          assert repo not in imported.parents, imported
          assert importlib.util.find_spec("transformers") is None

          retired = (
              "ser_lib.core",
              "ser_lib.services",
              "ser_lib.catalog",
              "ser_lib.engine.presets",
              "ser_lib.engine.evaluation_detail",
              "ser_lib.engine.runs",
              "ser_lib.engine.evaluation_runs",
              "ser_lib.engine.evaluation_catalog",
              "ser_lib.benchmark",
              "ser_lib.models.pretrained",
          )
          for module_name in retired:
              assert importlib.util.find_spec(module_name) is None, module_name

          required = (
              "ser_lib.config",
              "ser_lib.foundation",
              "ser_lib.models.adapters.torch",
              "ser_lib.models.adapters.huggingface",
              "ser_lib.engine.training_records",
              "ser_lib.engine.evaluation_records",
              "ser_lib.runtime",
          )
          for module_name in required:
              assert importlib.util.find_spec(module_name) is not None, module_name

          distribution = importlib.metadata.distribution("ser-lib")
          entries = {entry.name: entry.value for entry in distribution.entry_points}
          assert entries.get("ser") == "ser_lib.cli.main:main"
          print(ser_lib.__version__)
          PY
      - name: Run tests
        run: python -m pytest -q
      - name: End-to-end training smoke test
        run: python scripts/smoke_train_epoch.py --device cpu

  hf:
    name: HF Transformers ${{ matrix.transformers-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers-version: ["4.38.2", "5.17.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and pinned Transformers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "transformers==${{ matrix.transformers-version }}"
          python -m pip install -e ".[hf]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run real tiny Hugging Face integration
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -q tests/test_huggingface_integration.py tests/test_pretrained_adapter.py

  quality:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install quality, test and HF tools
        run: python -m pip install -e ".[test,dev,hf]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Ruff
        run: python -m ruff check .
      - name: Type-check library
        run: python -m mypy ser_lib
      - name: Coverage by package
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest --cov=ser_lib --cov-report=json -q && python scripts/check_coverage.py coverage.json
